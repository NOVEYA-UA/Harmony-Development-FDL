steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_AR_HOST}/${PROJECT_ID}/fdl-codex/fdl-codex:$_TAG', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/${PROJECT_ID}/fdl-codex/fdl-codex:$_TAG']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fdl-codex'
      - '--image=${_AR_HOST}/${PROJECT_ID}/fdl-codex/fdl-codex:$_TAG'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--set-env-vars=PROJECT_ID=$PROJECT_ID,REGION=${_REGION},VERTEX_LOCATION=${_REGION}'
substitutions:
  _REGION: 'europe-west4'
  _AR_HOST: 'europe-west4-docker.pkg.dev'
  _TAG: 'latest'
images:
  - '${_AR_HOST}/${PROJECT_ID}/fdl-codex/fdl-codex:$_TAG'
